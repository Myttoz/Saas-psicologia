# Modelo de workflow — copie para .github/workflows/backup.yml
# de um repositório PRIVADO (ex.: saas-psicologia-backup).
# Nunca coloque este workflow com secrets no repositório público do site.
#
# A senha vai no secret SUPABASE_DB_PASSWORD (em texto cru, sem codificar).
# Host e project ref não são segredos e já estão fixados abaixo.
name: Backup Supabase - semanal (Psicologia)

on:
  schedule:
    - cron: '0 10 * * 0'   # domingo 10:00 UTC = 07:00 de Brasília
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Gerar dump do banco
        env:
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Secret SUPABASE_DB_PASSWORD nao configurado"
            exit 1
          fi
          mkdir -p backups
          ARQUIVO="backups/backup-$(date +'%Y-%m-%d').dump"
          PGPASSWORD="$SUPABASE_DB_PASSWORD" /usr/lib/postgresql/17/bin/pg_dump \
            --host=aws-0-sa-east-1.pooler.supabase.com \
            --port=5432 \
            --username=postgres.wrdkbafdzjsqonyidrwv \
            --dbname=postgres \
            --format=custom \
            --schema=public \
            --no-owner --no-privileges \
            --file="$ARQUIVO"
          test -s "$ARQUIVO"
          ls -lh "$ARQUIVO"

      - name: Salvar no repositorio
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups
          if ! git diff --cached --quiet; then
            git commit -m "backup automatico $(date +'%Y-%m-%d')"
            git push
          fi
